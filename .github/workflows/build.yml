name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pin JDK 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV

      - name: Install buildozer and system deps
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y zip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libffi-dev libssl-dev ccache

      - name: Build APK
        shell: bash
        run: |
          echo "pip<26" > pip-constraints.txt
          PIP_CONSTRAINT="$PWD/pip-constraints.txt" yes | buildozer -v android debug > build.log 2>&1

      # приём 400 строк: при падении сборки в конце страницы запуска
      # печатается хвост лога — копируй оттуда без скроллинга
      - name: Show last error lines (400)
        if: failure()
        run: tail -n 400 build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-friend-apk
          path: bin/*.apk
