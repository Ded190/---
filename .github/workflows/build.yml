name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pin JDK 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV

      - name: Install buildozer and system deps
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y zip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libffi-dev libssl-dev ccache

      - name: Remember signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: pocket-friend-signing-v1

      - name: Build APK
        run: |
          rm -f bin/*.apk
          echo "pip<26" > pip-constraints.txt
          export PIP_CONSTRAINT="$PWD/pip-constraints.txt"
          yes | buildozer -v android debug > build.log 2>&1 || echo "buildozer вернул код $?, проверяем наличие APK"
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "=== APK СОБРАН ==="
            ls -la bin/
          else
            echo "=== APK НЕ СОБРАН ==="
            tail -n 100 build.log
            exit 1
          fi

      # приём 400 строк: при падении сборки в конце страницы запуска
      # печатается хвост лога — копируй оттуда без скроллинга
      - name: Show last error lines (400)
        if: failure()
        run: tail -n 400 build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-friend-apk
          path: bin/*.apk

